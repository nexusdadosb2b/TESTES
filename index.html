<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTE - PromoPrint Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Chewy&family=Fira+Sans+Extra+Condensed:wght@900&family=Permanent+Marker&display=swap');

        :root {
            --font-main: 'Impact', sans-serif;
            --color-theme: #e53e3e;
        }

        body {
            background-color: #f3f4f6;
            font-family: sans-serif;
        }

        /* Bloqueio de UI e Liberação de Páginas na Impressão */
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .print-area { 
                width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
            }
            .page-a4 {
                width: 210mm;
                height: 297mm;
                page-break-after: always;
                margin: 0;
                box-shadow: none !important;
            }
            /* A mágica que resolve a impressão de várias páginas */
            html, body, .print-area {
                height: auto !important;
                overflow: visible !important;
                display: block !important;
            }
        }

        .page-a4 {
            width: 210mm;
            height: 297mm;
            background: white;
            margin: 20px auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            display: grid;
            gap: 10px;
            padding: 20px;
        }

        /* Layouts de Grade */
        .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .grid-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        .poster-item {
            border: 1px dashed #ccc;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 10px;
            background-size: cover;
            background-position: center;
        }

        /* Fontes e Pesos Forçados */
        .text-heavy {
            font-family: var(--font-main);
            font-weight: 900 !important;
            color: #1a202c;
            text-align: center;
            line-height: 1.1;
        }

        .color-theme { color: var(--color-theme) !important; }

        /* Tabela Blindada de Preço */
        .price-table {
            margin: 0 auto;
            border-collapse: collapse;
        }
        .price-table td {
            padding: 0;
            vertical-align: top;
            font-family: var(--font-main);
            font-weight: 900 !important;
            line-height: 0.8;
        }
        .symbol-td { font-size: 0.4em; padding-top: 0.1em; }
        .cents-td { font-size: 0.5em; padding-top: 0.1em; }

        /* Blocos Redimensionáveis Independentes */
        .resize-container {
            position: relative;
            border: 1px dashed transparent;
            display: inline-block;
            margin: 5px auto;
        }
        .resize-container:hover { border-color: #3b82f6; }
        .resize-handle {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 15px;
            height: 15px;
            background: #10b981;
            border-radius: 50%;
            cursor: se-resize;
            display: none;
        }
        .resize-container:hover .resize-handle { display: block; }
        
        .header-img, .footer-img {
            width: 100%;
            object-fit: contain;
        }
        .header-img { max-height: 15%; margin-bottom: 10px; }
        .footer-img { max-height: 15%; margin-top: auto; }
        
        .global-club-logo {
            object-fit: contain;
            margin: 0 auto;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Menu Lateral (Não sai na impressão) -->
    <div class="w-80 bg-gray-900 text-white p-5 overflow-y-auto no-print flex flex-col gap-6">
        <h1 class="text-2xl font-bold text-center text-blue-400">PromoPrint Maker</h1>
        
        <!-- Ação Principal -->
        <div class="bg-green-600 p-4 rounded-lg text-center cursor-pointer hover:bg-green-500 transition shadow-lg" onclick="window.print()">
            <h2 class="text-xl font-bold">Gerar PDF / Imprimir</h2>
            <p class="text-xs mt-2">Lembre-se de ativar "Gráficos de Plano de Fundo" na janela de impressão.</p>
        </div>

        <!-- Fonte e Cores -->
        <div class="space-y-2 border-b border-gray-700 pb-4">
            <label class="text-sm font-semibold">Fonte Principal</label>
            <select id="fontSelect" class="w-full p-2 bg-gray-800 rounded text-white border border-gray-700" onchange="updateStyles()">
                <option value="'Impact', sans-serif">Supermercado (Impact)</option>
                <option value="'Bebas Neue', cursive">Bebas Neue (Moderna)</option>
                <option value="'Fira Sans Extra Condensed', sans-serif">Fira Sans (Condensada)</option>
                <option value="'Chewy', cursive">Chewy (Divertida)</option>
                <option value="'Permanent Marker', cursive">Marker (Pincel)</option>
                <option value="'Caveat', cursive">Caveat (Manuscrita)</option>
            </select>
            
            <label class="text-sm font-semibold mt-3 block">Cor Tema (Preço Principal/Clube)</label>
            <input type="color" id="themeColor" value="#e53e3e" class="w-full h-10 rounded cursor-pointer" onchange="updateStyles()">
        </div>

        <!-- Layout Normal (Oculto via JS se Automático) -->
        <div id="manualLayoutBox" class="space-y-2 border-b border-gray-700 pb-4">
            <label class="text-sm font-semibold">Layout da Folha (Manual)</label>
            <select id="layoutSelect" class="w-full p-2 bg-gray-800 rounded text-white border border-gray-700" onchange="renderPosters()">
                <option value="1">1 Produto (A4 Inteiro)</option>
                <option value="2">2 Produtos (Metade)</option>
                <option value="4">4 Produtos (Pequeno)</option>
            </select>
        </div>

        <!-- Importar Planilha -->
        <div class="space-y-2 border-b border-gray-700 pb-4 bg-gray-800 p-3 rounded">
            <label class="text-sm font-semibold text-blue-300">Importar Planilha (Excel)</label>
            <input type="file" id="excelUpload" accept=".xlsx, .xls" class="w-full text-sm" onchange="handleExcelUpload(event)">
            <p class="text-xs text-gray-400 mt-1">Colunas: Nome | Preço 1 | Preço 2<br>Opcional p/ Auto-Layout: Grande | Médio | Pequeno</p>
        </div>

        <!-- Estrutura / Imagens -->
        <div class="space-y-4 border-b border-gray-700 pb-4">
            <label class="text-sm font-semibold text-yellow-400">Imagens Fixas</label>
            
            <div>
                <label class="text-xs">Cabeçalho (Topo)</label>
                <input type="file" id="headerUpload" accept="image/*" class="w-full text-xs mb-1" onchange="handleImageUpload(event, 'header')">
                <button onclick="removeImage('header')" class="text-xs bg-red-600 px-2 py-1 rounded w-full hover:bg-red-500">Remover Cabeçalho</button>
            </div>
            
            <div>
                <label class="text-xs">Rodapé (Base)</label>
                <input type="file" id="footerUpload" accept="image/*" class="w-full text-xs mb-1" onchange="handleImageUpload(event, 'footer')">
                <button onclick="removeImage('footer')" class="text-xs bg-red-600 px-2 py-1 rounded w-full hover:bg-red-500">Remover Rodapé</button>
            </div>
        </div>

        <!-- Configuração Clube / Secundário -->
        <div class="space-y-2 border-b border-gray-700 pb-4">
            <label class="text-sm font-semibold text-pink-400">Tipo de Preço Secundário</label>
            <select id="priceType" class="w-full p-2 bg-gray-800 rounded text-white border border-gray-700" onchange="toggleClubMenu()">
                <option value="depor">De / Por</option>
                <option value="clube">Clube de Vantagens</option>
            </select>

            <!-- Textos Base -->
            <div class="flex gap-2 mt-2">
                <input type="text" id="text1" value="PREÇO NORMAL" class="w-1/2 p-1 bg-gray-800 text-xs text-white border border-gray-600 rounded" oninput="updatePostersSilent()">
                <input type="text" id="text2" value="CLIENTE CLUBE" class="w-1/2 p-1 bg-gray-800 text-xs text-white border border-gray-600 rounded" oninput="updatePostersSilent()">
            </div>

            <!-- Logo do Clube (Aparece se Clube for selecionado) -->
            <div id="clubLogoMenu" class="hidden mt-3 bg-gray-800 p-2 rounded">
                <label class="text-xs text-pink-300">Logomarca do Clube (Substitui Texto 2)</label>
                <input type="file" id="clubUpload" accept="image/*" class="w-full text-xs mb-1" onchange="handleImageUpload(event, 'club')">
                <button onclick="removeImage('club')" class="text-xs bg-red-600 px-2 py-1 rounded w-full hover:bg-red-500 mb-2">Remover Logo</button>
                
                <label class="text-xs text-gray-300">Tamanho Global da Logo</label>
                <input type="range" id="clubScale" min="50" max="1000" value="150" class="w-full" oninput="updatePostersSilent()">
            </div>
        </div>

        <button onclick="clearAll()" class="bg-red-700 p-2 rounded text-sm hover:bg-red-600">Limpar Tudo</button>
    </div>

    <!-- Área Principal de Visualização -->
    <div class="flex-1 overflow-auto print-area bg-gray-200 p-10" id="printContainer">
        <!-- Renderizado via JS -->
    </div>

    <script>
        let state = {
            products: [],
            autoQueues: { grande: [], medio: [], pequeno: [] },
            isAutoLayout: false,
            images: { header: null, footer: null, club: null }
        };

        function updateStyles() {
            document.documentElement.style.setProperty('--font-main', document.getElementById('fontSelect').value);
            document.documentElement.style.setProperty('--color-theme', document.getElementById('themeColor').value);
        }

        function toggleClubMenu() {
            const type = document.getElementById('priceType').value;
            const clubMenu = document.getElementById('clubLogoMenu');
            const text1 = document.getElementById('text1');
            const text2 = document.getElementById('text2');

            if(type === 'clube') {
                clubMenu.classList.remove('hidden');
                text1.value = "PREÇO NORMAL";
                text2.value = "CLIENTE CLUBE";
            } else {
                clubMenu.classList.add('hidden');
                text1.value = "DE R$";
                text2.value = "POR R$";
            }
            updatePostersSilent();
        }

        function handleImageUpload(event, type) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    state.images[type] = e.target.result;
                    renderPosters();
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage(type) {
            state.images[type] = null;
            document.getElementById(`${type}Upload`).value = "";
            renderPosters();
        }

        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet);

                state.products = [];
                state.autoQueues = { grande: [], medio: [], pequeno: [] };
                state.isAutoLayout = false;

                if (rows.length > 0) {
                    const firstRow = rows[0];
                    // Detecta colunas de inteligência
                    if ('Grande' in firstRow || 'Médio' in firstRow || 'Pequeno' in firstRow ||
                        'grande' in firstRow || 'médio' in firstRow || 'pequeno' in firstRow) {
                        state.isAutoLayout = true;
                    }
                }

                document.getElementById('manualLayoutBox').style.display = state.isAutoLayout ? 'none' : 'block';

                rows.forEach(row => {
                    let name = row['Produto'] || row['Nome'] || '';
                    let p1 = row['Preço 1'] || row['Preco 1'] || '';
                    let p2 = row['Preço 2'] || row['Preco 2'] || '';
                    let prodData = { name, p1, p2 };

                    if (state.isAutoLayout) {
                        let qG = parseInt(row['Grande'] || row['grande'] || 0) || 0;
                        let qM = parseInt(row['Médio'] || row['médio'] || row['Medio'] || 0) || 0;
                        let qP = parseInt(row['Pequeno'] || row['pequeno'] || 0) || 0;

                        for(let i=0; i<qG; i++) state.autoQueues.grande.push(prodData);
                        for(let i=0; i<qM; i++) state.autoQueues.medio.push(prodData);
                        for(let i=0; i<qP; i++) state.autoQueues.pequeno.push(prodData);
                    } else {
                        state.products.push(prodData);
                    }
                });

                renderPosters();
            };
            reader.readAsArrayBuffer(file);
        }

        function splitPrice(priceStr) {
            let str = priceStr.toString().replace('R$', '').trim();
            if(!str.includes(',') && !str.includes('.')) str += ',00';
            str = str.replace('.', ',');
            let parts = str.split(',');
            return {
                main: parts[0],
                cents: parts[1] ? ',' + parts[1] : ',00'
            };
        }

        function renderPosters() {
            const container = document.getElementById('printContainer');
            container.innerHTML = '';
            
            let pagesHTML = '';

            if (state.isAutoLayout) {
                // Renders Filas (Queues)
                pagesHTML += buildPages(state.autoQueues.grande, 1);
                pagesHTML += buildPages(state.autoQueues.medio, 2);
                pagesHTML += buildPages(state.autoQueues.pequeno, 4);
            } else {
                const layout = parseInt(document.getElementById('layoutSelect').value);
                pagesHTML += buildPages(state.products, layout);
            }

            container.innerHTML = pagesHTML;
        }

        function buildPages(productList, layoutCount) {
            if (productList.length === 0) return '';
            
            let html = '';
            for (let i = 0; i < productList.length; i += layoutCount) {
                const chunk = productList.slice(i, i + layoutCount);
                html += `<div class="page-a4 grid-${layoutCount}">`;
                
                chunk.forEach(prod => {
                    html += buildPosterItem(prod, layoutCount);
                });
                
                html += `</div>`;
            }
            return html;
        }

        function buildPosterItem(prod, layoutCount) {
            const type = document.getElementById('priceType').value;
            const text1 = document.getElementById('text1').value;
            const text2 = document.getElementById('text2').value;
            const clubScale = document.getElementById('clubScale').value;
            
            // Cálculos dinâmicos baseados no formato da folha
            const baseScale = layoutCount === 1 ? 1 : layoutCount === 2 ? 0.7 : 0.5;
            
            const p1 = splitPrice(prod.p1);
            const p2 = splitPrice(prod.p2);

            let headerHtml = state.images.header ? `<img src="${state.images.header}" class="header-img">` : '';
            let footerHtml = state.images.footer ? `<img src="${state.images.footer}" class="footer-img">` : '';

            // Bloco Secundário (Texto ou Logo)
            let secondaryBlock = '';
            if (type === 'clube' && state.images.club) {
                secondaryBlock = `<img src="${state.images.club}" class="global-club-logo" style="width: ${clubScale}px;">`;
            } else {
                secondaryBlock = `<div class="text-heavy color-theme" style="font-size: ${40 * baseScale}px;">${text2}</div>`;
            }

            return `
            <div class="poster-item">
                ${headerHtml}
                
                <div class="flex-1 flex flex-col justify-center items-center">
                    
                    <div class="resize-container text-heavy" style="font-size: ${80 * baseScale}px;">
                        ${prod.name}
                        <div class="resize-handle"></div>
                    </div>

                    ${prod.p1 ? `
                    <div class="resize-container mt-4">
                        <div class="text-heavy" style="font-size: ${30 * baseScale}px; color: #4a5568;">
                            ${text1}
                        </div>
                        <table class="price-table" style="font-size: ${60 * baseScale}px; color: #4a5568;">
                            <tr>
                                <td class="symbol-td">R$</td>
                                <td>${p1.main}</td>
                                <td class="cents-td">${p1.cents}</td>
                            </tr>
                        </table>
                        <div class="resize-handle"></div>
                    </div>
                    ` : ''}

                    <div class="resize-container mt-4">
                        ${secondaryBlock}
                        <table class="price-table color-theme" style="font-size: ${160 * baseScale}px;">
                            <tr>
                                <td class="symbol-td">R$</td>
                                <td>${p2.main}</td>
                                <td class="cents-td">${p2.cents}</td>
                            </tr>
                        </table>
                        <div class="resize-handle"></div>
                    </div>
                </div>

                ${footerHtml}
            </div>`;
        }

        function updatePostersSilent() {
            if(state.products.length > 0 || state.isAutoLayout) {
                renderPosters();
            }
        }

        function clearAll() {
            state.products = [];
            state.autoQueues = { grande: [], medio: [], pequeno: [] };
            state.isAutoLayout = false;
            document.getElementById('excelUpload').value = '';
            renderPosters();
        }

        // Lógica de Redimensionamento e Arraste Manual
        let isResizing = false;
        let currentHandle = null;
        let startY = 0;
        let startFontSize = 0;

        document.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('resize-handle')) {
                isResizing = true;
                currentHandle = e.target;
                startY = e.clientY;
                
                let targetElement = currentHandle.previousElementSibling || currentHandle.parentElement;
                
                // Se o handle estiver dentro de um bloco com tabela, queremos escalar a tabela
                let tableElement = currentHandle.parentElement.querySelector('.price-table');
                let textElement = currentHandle.parentElement.querySelector('.text-heavy');
                let imgElement = currentHandle.parentElement.querySelector('img');

                if (tableElement) {
                     startFontSize = parseFloat(window.getComputedStyle(tableElement).fontSize);
                     currentHandle.dataset.targetType = 'table';
                } else if (imgElement) {
                     startFontSize = parseFloat(window.getComputedStyle(imgElement).width);
                     currentHandle.dataset.targetType = 'img';
                } else {
                     startFontSize = parseFloat(window.getComputedStyle(targetElement).fontSize);
                     currentHandle.dataset.targetType = 'text';
                }
                
                e.preventDefault();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing || !currentHandle) return;
            const dy = e.clientY - startY;
            const newSize = Math.max(10, startFontSize + dy); // Limite mínimo
            
            let parent = currentHandle.parentElement;
            let type = currentHandle.dataset.targetType;

            if (type === 'table') {
                let table = parent.querySelector('.price-table');
                if (table) table.style.fontSize = `${newSize}px`;
            } else if (type === 'img') {
                let img = parent.querySelector('img');
                if (img) img.style.width = `${newSize}px`;
            } else {
                parent.style.fontSize = `${newSize}px`;
            }
        });

        document.addEventListener('mouseup', () => {
            isResizing = false;
            currentHandle = null;
        });

    </script>
</body>
</html>
